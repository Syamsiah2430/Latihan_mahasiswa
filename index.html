<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan Tugas Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Catatan Tugas</h1>
        <div class="form-group">
            <input type="text" id="taskName" placeholder="Nama Tugas (contoh: Makalah AI)">
            <input type="text" id="taskSubject" placeholder="Mata Kuliah">
            <input type="date" id="taskDeadline">
            <button onclick="addTask()">Tambah Tugas</button>
        </div>
        <div class="task-list" id="taskList">
            <!-- Tasks will appear here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
